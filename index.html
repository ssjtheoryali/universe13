<!DOCTYPE html>

		<!-- U13 loading shell (Theory 2026-10-20: "without the Godot loading screen, can we put one there instead").
		     Godot's web shell logic (template godot.html, 4.7.2) with the Battle Clash key art, a gold progress bar,
		     MB counter and tips. The art files (loading_wide.jpg / loading_tall.jpg, in godot/export/web/) must be copied next to index.html after
		     exporting; if they are missing the page falls back to the boot splash (index.png, written by every export). -->
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}
body {
	color: white;
	background-color: #05040a;
	overflow: hidden;
	touch-action: none;
}
#canvas {
	display: block;
}
#canvas:focus {
	outline: none;
}
#status {
	position: absolute;
	inset: 0;
	background: #05040a;
	visibility: hidden;
	overflow: hidden;
	font-family: 'Arial Black', 'Arial', sans-serif;
	z-index: 10;
}
#u13-art {
	position: absolute;
	inset: 0;
	width: 100%;
	height: 100%;
	object-fit: cover;
	object-position: center 30%;
	animation: u13-zoom 30s ease-out forwards;
}
@keyframes u13-zoom { from { transform: scale(1.0); } to { transform: scale(1.08); } }
#u13-shade {
	position: absolute;
	inset: 0;
	background: linear-gradient(to bottom, rgba(5,4,10,0) 45%, rgba(5,4,10,0.75) 75%, rgba(5,4,10,0.96) 100%);
}
#u13-load {
	position: absolute;
	left: 50%;
	bottom: 6%;
	transform: translateX(-50%);
	width: min(720px, 86vw);
	text-align: center;
}
#u13-title {
	color: #ffd24a;
	font-size: clamp(16px, 2.4vw, 26px);
	letter-spacing: 0.18em;
	text-shadow: 0 0 12px rgba(255, 170, 40, 0.8), 0 2px 0 #000;
	margin-bottom: 12px;
}
#u13-bar {
	position: relative;
	height: 14px;
	border-radius: 7px;
	background: rgba(255, 255, 255, 0.12);
	border: 1px solid rgba(255, 210, 74, 0.7);
	box-shadow: 0 0 14px rgba(255, 170, 40, 0.35);
	overflow: hidden;
}
#u13-fill {
	position: absolute;
	left: 0;
	top: 0;
	bottom: 0;
	width: 0%;
	background: linear-gradient(90deg, #ff7a18, #ffd24a 60%, #fff3c0);
	box-shadow: 0 0 16px #ffb02e;
	transition: width 0.25s linear;
}
#u13-fill.u13-busy {
	width: 35% !important;
	animation: u13-sweep 1.2s ease-in-out infinite;
}
@keyframes u13-sweep { from { left: -35%; } to { left: 100%; } }
#u13-meta {
	display: flex;
	justify-content: space-between;
	margin-top: 8px;
	color: #e8e2ff;
	font: 700 clamp(11px, 1.3vw, 14px) Arial, sans-serif;
	text-shadow: 0 1px 0 #000;
}
#u13-tip {
	margin-top: 14px;
	min-height: 1.4em;
	color: #fff;
	opacity: 0.85;
	font: italic 700 clamp(11px, 1.4vw, 15px) Arial, sans-serif;
	text-shadow: 0 1px 2px #000;
	transition: opacity 0.4s;
}
#u13-note {
	margin-top: 6px;
	color: rgba(255, 255, 255, 0.5);
	font: 400 clamp(10px, 1.1vw, 12px) Arial, sans-serif;
}
#status-notice {
	display: none;
	position: absolute;
	left: 50%;
	top: 50%;
	transform: translate(-50%, -50%);
	max-width: 80vw;
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<nav id="u13-nav" style="position:fixed;top:6px;right:8px;z-index:99999;background:#080812e8;padding:8px 12px;border:1px solid #ffd24a;border-radius:8px;font:700 12px Arial,sans-serif"><a style="color:#ffd24a;margin-right:16px" href="/universe13-story/">STORY</a><a style="color:#fff" href="/universe13-classic/">CLASSIC BROWSER GAME</a></nav>
		<script>["keydown","pointerdown","touchstart"].forEach(function(t){addEventListener(t,function(){var n=document.getElementById("u13-nav");if(n)n.remove();},{once:true,capture:true});});</script>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<picture>
				<source media="(orientation: portrait)" srcset="loading_tall.jpg">
				<img id="u13-art" src="loading_wide.jpg" alt="Universe 13: Battle Clash" onerror="this.onerror=null;this.parentNode.querySelector('source').remove();this.src='index.png';">
			</picture>
			<div id="u13-shade"></div>
			<div id="u13-load">
				<div id="u13-title">ENTERING THE JUEVYVERSE</div>
				<div id="u13-bar"><div id="u13-fill" class="u13-busy"></div></div>
				<div id="u13-meta"><span id="u13-mb">Connecting...</span><span id="u13-pct"></span></div>
				<div id="u13-tip"></div>
				<div id="u13-note">First visit downloads the whole game (about 880 MB). Next time it loads from your browser cache.</div>
			</div>
			<div id="status-notice"></div>
		</div>

		<script src="u13-pack.js"></script>
		<script src="u13-pack-loader.js"></script>
		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":895895032,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusNotice = document.getElementById('status-notice');
	const fill = document.getElementById('u13-fill');
	const mbText = document.getElementById('u13-mb');
	const pctText = document.getElementById('u13-pct');
	const titleText = document.getElementById('u13-title');
	const tipText = document.getElementById('u13-tip');
	const loadBox = document.getElementById('u13-load');

	// tips rotate every 5 s while the game downloads
	const TIPS = [
		'X X X X: the light string ends in a wall-bounce BREAKER',
		'Up + Y launches, then jump to chase them into the air',
		'Hold B for your clasher\'s original power',
		'Flick the right stick for four more powers: rush, rise, pull, eruption',
		'LT + Y powers up your ki',
		'LB / RB / LB+RB: one, three or five bars of ultimate',
		'Combo Lab: F6 plays the demo of every combo trial',
		'Every clasher hits in its own element. Find your favourite',
		'Down + RT fires your signature beam (no meter)',
		'Perfect guard with LT right as the hit lands',
	];
	let tipI = Math.floor(Math.random() * TIPS.length);
	function nextTip() {
		tipText.style.opacity = 0;
		setTimeout(() => { tipText.textContent = 'TIP: ' + TIPS[tipI % TIPS.length]; tipText.style.opacity = 0.85; tipI++; }, 400);
	}
	nextTip();
	const tipTimer = setInterval(nextTip, 5000);

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			clearInterval(tipTimer);
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		loadBox.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		// ?u13args=--quick%20--stage=x hands the game its command line (the web FPS test opens a fight straight away)
		const u13args = (new URLSearchParams(location.search).get('u13args') || '').split(' ').filter(Boolean);
		engine.startGame({
			'args': u13args.length ? ['--'].concat(u13args) : [],
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					fill.classList.remove('u13-busy');
					const k = Math.min(1, current / total);
					fill.style.width = (k * 100).toFixed(1) + '%';
					mbText.textContent = Math.round(current / 1e6) + ' / ' + Math.round(total / 1e6) + ' MB';
					pctText.textContent = Math.floor(k * 100) + '%';
					if (k >= 1) {
						titleText.textContent = 'STARTING BATTLE CLASH';
						fill.classList.add('u13-busy');
						mbText.textContent = 'Unpacking the game...';
						pctText.textContent = '';
					}
				} else {
					fill.classList.add('u13-busy');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
